<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimalist Post Feed Card — 840x420</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #capture-stage {
      position: relative;
      width: 840px;
      height: 420px;
      background: #111113;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-container {
      width: 100%;
      height: 100%;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="capture-stage" data-width="840" data-height="420">
    <div class="svg-container" id="stage-slot">
      <svg width="840" height="420" viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg">
        <!-- Obsidian Substrate -->
        <rect width="840" height="420" fill="#111113" />

        <!-- Outer Precision Boundary -->
        <rect x="24" y="24" width="792" height="372" fill="#0E0E12" stroke="#26262E" stroke-width="1.5" />
        <rect x="24" y="24" width="4" height="372" fill="#DE2626" />

        <!-- Coordinate Crosshairs -->
        <path d="M 44 40 L 44 52 M 38 46 L 50 46" stroke="#3A3A44" stroke-width="1.5" />
        <path d="M 796 40 L 796 52 M 790 46 L 802 46" stroke="#3A3A44" stroke-width="1.5" />

        <!-- Header Category Tag -->
        <g transform="translate(48, 48)">
          <rect x="0" y="0" width="130" height="22" fill="#1C1C22" stroke="#DE2626" stroke-width="1" />
          <text x="65" y="15" fill="#DE2626" font-size="10" font-family="monospace" font-weight="800" text-anchor="middle" letter-spacing="1.5">{{TAG:-BEJSON 105 • POST}}</text>
        </g>

        <!-- Post Title & Subtitle -->
        <text x="48" y="112" fill="#FFFFFF" font-size="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="0.5">{{TITLE:-ARTICLE POST FEED CARD}}</text>
        <text x="48" y="140" fill="#A1A1AA" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="500" letter-spacing="0.5">{{SUBTITLE:-Zero-SQL Positional Flat-File Architecture}}</text>
        <line x1="48" y1="160" x2="792" y2="160" stroke="#262630" stroke-width="1" />

        <!-- Left Mini Isometric Substrate -->
        <g transform="translate(130, 260)">
          <circle cx="0" cy="0" r="54" fill="none" stroke="#262630" stroke-width="1" stroke-dasharray="3,3" />
          <circle cx="0" cy="0" r="40" fill="none" stroke="#DE2626" stroke-width="1" opacity="0.3" />
          <polygon points="0,-32 28,-16 0,0 -28,-16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
          <polygon points="0,-25 20,-13 0,-2 -20,-13" fill="#111113" opacity="0.9" />
          <polygon points="-28,-16 0,0 0,32 -28,16" fill="#1C1C22" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
          <polygon points="0,0 28,-16 28,16 0,32" fill="#DE2626" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
        </g>

        <!-- Right 3-Pillar Component Specifications -->
        <g transform="translate(230, 185)">
          <!-- Spec 1 -->
          <rect x="0" y="0" width="560" height="38" fill="#16161C" stroke="#26262E" stroke-width="1" />
          <rect x="0" y="0" width="28" height="38" fill="#1E1E26" />
          <text x="14" y="24" fill="#DE2626" font-size="11" font-family="monospace" font-weight="800" text-anchor="middle">[01]</text>
          <text x="40" y="16" fill="#FFFFFF" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700">{{COMP1_TITLE:-DATA PERSISTENCE}}</text>
          <text x="40" y="30" fill="#888894" font-size="10" font-family="monospace">{{COMP1_DESC:-Positional Flat-File Matrices}}</text>

          <!-- Spec 2 -->
          <rect x="0" y="46" width="560" height="38" fill="#16161C" stroke="#26262E" stroke-width="1" />
          <rect x="0" y="46" width="28" height="38" fill="#1E1E26" />
          <text x="14" y="70" fill="#DE2626" font-size="11" font-family="monospace" font-weight="800" text-anchor="middle">[02]</text>
          <text x="40" y="62" fill="#FFFFFF" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700">{{COMP2_TITLE:-MANIFEST ENGINE}}</text>
          <text x="40" y="76" fill="#888894" font-size="10" font-family="monospace">{{COMP2_DESC:-Bidirectional MFDB Master}}</text>

          <!-- Spec 3 -->
          <rect x="0" y="92" width="560" height="38" fill="#16161C" stroke="#26262E" stroke-width="1" />
          <rect x="0" y="92" width="28" height="38" fill="#1E1E26" />
          <text x="14" y="116" fill="#DE2626" font-size="11" font-family="monospace" font-weight="800" text-anchor="middle">[03]</text>
          <text x="40" y="108" fill="#FFFFFF" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700">{{COMP3_TITLE:-RUNTIME VERIFICATION}}</text>
          <text x="40" y="122" fill="#888894" font-size="10" font-family="monospace">{{COMP3_DESC:-Strict Zero-SQL Schemas}}</text>
        </g>

        <!-- Footer Line & Brand Lock -->
        <line x1="48" y1="360" x2="792" y2="360" stroke="#262630" stroke-width="1" />
        <text x="48" y="380" fill="#71717A" font-size="11" font-family="monospace" font-weight="600">ELTON BOEHNEN • ZERO-SQL FLAT FILE CMS</text>
        <g transform="translate(710, 368)">
          <text x="0" y="12" fill="#FFFFFF" font-size="14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="1">BEJSON</text>
          <polygon points="68,2 75,5 68,9 61,5" fill="#DE2626" />
        </g>
      </svg>
    </div>
  </div>
  <script>
    window.isReadyToCapture = true;
    window.setSvgContent = function(markup) {
      document.getElementById('stage-slot').innerHTML = markup;
      window.isReadyToCapture = true;
    };
  </script>
</body>
</html>
