<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Title</title>
<!--
Name:           BEHTML Image & Video Grid Scaffold
Description:    Mixed multimedia grid scaffold with media type indicators, filter controls, responsive aspect boxes, and minimal functional tags.
Author:         Elton Boehnen
Release_Version: 300
Package_Version: 105
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-canvas: #060606;
    --bg-surface: #101010;
    --bg-surface-elevated: #161616;
    --bg-media: #141414;
    --fg-primary: #FFFFFF;
    --fg-secondary: #CCCCCC;
    --fg-muted: #888888;
    --border-color: #262626;
    --border-light: #3a3a3a;
    --accent-red: #DE2626;
    --radius-main: 6px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-canvas);
    color: var(--fg-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 24px 20px 60px;
  }

  code, pre, .becss-mono {
    font-family: 'Source Code Pro', monospace;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .becss-navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 24px;
  }

  .becss-brand {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg-primary);
    text-decoration: none;
  }

  .becss-badge {
    border: 1px solid var(--accent-red);
    color: var(--accent-red);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 2px;
    font-family: 'Source Code Pro', monospace;
  }

  .becss-header {
    background: var(--bg-surface);
    border-radius: var(--radius-main);
    border-top: 3px solid var(--accent-red);
    padding: 28px 24px;
    margin-bottom: 24px;
  }

  .becss-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .becss-sub {
    font-size: 0.95rem;
    color: var(--fg-secondary);
  }

  /* Multi-Format Media Grid */
  .becss-media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .becss-media-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-main);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s ease;
  }

  .becss-media-card:hover {
    border-color: var(--border-light);
  }

  .becss-media-frame {
    width: 100%;
    aspect-ratio: 16 / 10;
    background-color: var(--bg-media);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 1px solid var(--border-color);
  }

  .becss-type-tag {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid var(--border-color);
    color: var(--accent-red);
    font-size: 10px;
    font-family: 'Source Code Pro', monospace;
    padding: 2px 6px;
    border-radius: 2px;
    text-transform: uppercase;
  }

  .becss-media-card-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .becss-media-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg-primary);
  }

  .becss-media-card-meta {
    font-size: 12px;
    color: var(--fg-muted);
  }

  .becss-paging-feet {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-main);
    padding: 12px 20px;
    font-size: 13px;
  }

  .becss-btn-sm {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--fg-secondary);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }

  .becss-btn-sm:hover {
    border-color: var(--accent-red);
    color: var(--accent-red);
  }
</style>
</head>
<body>
  <div class="container">
    <header class="becss-navbar">
      <a href="#" class="becss-brand">
        <span class="becss-badge">MEDIA</span>
        <span>App Brand</span>
      </a>
      <a href="#" class="becss-btn-sm">nav_link_1</a>
    </header>

    <section class="becss-header">
      <h1 class="becss-title">Section Heading</h1>
      <p class="becss-sub">Subtitle</p>
    </section>

    <main class="becss-media-grid">
      <div class="becss-media-card">
        <div class="becss-media-frame">
          <span class="becss-type-tag">VIDEO</span>
          <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">Video Canvas [16:9]</span>
        </div>
        <div class="becss-media-card-body">
          <h2 class="becss-media-card-title">Card Title</h2>
          <div class="becss-media-card-meta">Timestamp</div>
        </div>
      </div>

      <div class="becss-media-card">
        <div class="becss-media-frame">
          <span class="becss-type-tag">IMAGE</span>
          <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">Image Canvas [16:10]</span>
        </div>
        <div class="becss-media-card-body">
          <h2 class="becss-media-card-title">Card Title</h2>
          <div class="becss-media-card-meta">Timestamp</div>
        </div>
      </div>
    </main>

    <nav class="becss-paging-feet" aria-label="Pagination">
      <a href="#" class="becss-btn-sm">Prev</a>
      <span class="becss-mono" style="font-size: 12px; color: var(--fg-muted);">Page 1 of 8</span>
      <a href="#" class="becss-btn-sm">Next</a>
    </nav>
  </div>
</body>
</html>
