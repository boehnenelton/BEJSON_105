<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Title</title>
<!--
Name:           BEHTML Master Portal & Index Scaffold
Description:    Master website index and portal scaffold featuring 8-lane grid layout, category tabs, filterable search bar, responsive card grid, and minimal functional placeholders.
Author:         Elton Boehnen
Release_Version: 300
Package_Version: 105
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-canvas: #060606;
    --bg-surface: #101010;
    --bg-surface-elevated: #161616;
    --bg-input: #0a0a0a;
    --fg-primary: #FFFFFF;
    --fg-secondary: #CCCCCC;
    --fg-muted: #888888;
    --border-color: #262626;
    --border-light: #3a3a3a;
    --accent-red: #DE2626;
    --accent-hover: #ef4444;
    --ry: 32px;
    --radius-main: 6px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-canvas);
    color: var(--fg-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 0 0 48px 0;
  }

  code, pre, .becss-mono {
    font-family: 'Source Code Pro', monospace;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Top Navigation */
  .becss-navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 32px;
  }

  .becss-brand {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg-primary);
    text-decoration: none;
  }

  .becss-badge {
    background: transparent;
    border: 1px solid var(--accent-red);
    color: var(--accent-red);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 2px;
    font-family: 'Source Code Pro', monospace;
  }

  .becss-nav-links {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .becss-nav-link {
    color: var(--fg-secondary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 4px;
    background: var(--bg-surface);
    transition: all 0.15s ease;
  }

  .becss-nav-link:hover {
    color: #FFFFFF;
    background: var(--bg-surface-elevated);
  }

  /* Hero Section */
  .becss-hero {
    background: var(--bg-surface);
    border-radius: var(--radius-main);
    border-top: 3px solid var(--accent-red);
    padding: 36px 32px;
    margin-bottom: 28px;
  }

  .becss-hero-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .becss-hero-sub {
    font-size: 1rem;
    color: var(--fg-secondary);
    margin-bottom: 20px;
  }

  /* Category Filter Navigation Bar */
  .becss-category-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .becss-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .becss-tab-btn {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    color: var(--fg-secondary);
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .becss-tab-btn:hover {
    border-color: var(--accent-red);
    color: #FFFFFF;
  }

  .becss-tab-btn.is-active {
    background: var(--accent-red);
    border-color: var(--accent-red);
    color: #FFFFFF;
    font-weight: 600;
  }

  .becss-search-box {
    display: flex;
    align-items: center;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 6px 12px;
    width: 280px;
    max-width: 100%;
  }

  .becss-search-input {
    background: transparent;
    border: none;
    color: var(--fg-primary);
    font-size: 13px;
    outline: none;
    width: 100%;
    font-family: inherit;
  }

  /* 8-Lane Responsive Card Grid */
  .behtml-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .behtml-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-main);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.2s ease;
  }

  .behtml-card:hover {
    border-color: var(--border-light);
  }

  .behtml-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .behtml-card-badge {
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    color: var(--accent-red);
  }

  .behtml-card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--fg-primary);
  }

  .behtml-card-body {
    font-size: 13px;
    color: var(--fg-secondary);
    flex: 1;
  }

  .behtml-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
  }

  .becss-btn-sm {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--fg-secondary);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }

  .becss-btn-sm:hover {
    border-color: var(--accent-red);
    color: var(--accent-red);
  }

  /* Footer */
  .becss-footer {
    border-top: 1px solid var(--border-color);
    padding-top: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--fg-muted);
  }

  .becss-footer-links {
    display: flex;
    gap: 16px;
  }

  .becss-footer-link {
    color: var(--fg-muted);
    text-decoration: none;
  }

  .becss-footer-link:hover {
    color: var(--fg-primary);
  }
</style>
</head>
<body>
  <div class="container">
    <header class="becss-navbar">
      <a href="#" class="becss-brand">
        <span class="becss-badge">BEHTML</span>
        <span>App Brand</span>
      </a>
      <nav class="becss-nav-links">
        <a href="#" class="becss-nav-link">nav_link_1</a>
        <a href="#" class="becss-nav-link">nav_link_2</a>
      </nav>
    </header>

    <section class="becss-hero">
      <h1 class="becss-hero-title">Page Title</h1>
      <p class="becss-hero-sub">Subtitle</p>
    </section>

    <div class="becss-category-bar">
      <div class="becss-tabs">
        <button type="button" class="becss-tab-btn is-active">Category 1</button>
        <button type="button" class="becss-tab-btn">Category 2</button>
        <button type="button" class="becss-tab-btn">Category 3</button>
      </div>
      <div class="becss-search-box">
        <input type="text" class="becss-search-input" placeholder="Search text">
      </div>
    </div>

    <main class="behtml-card-grid">
      <div class="behtml-card">
        <div class="behtml-card-header">
          <span class="behtml-card-badge">tag_1</span>
        </div>
        <h2 class="behtml-card-title">Card Title</h2>
        <div class="behtml-card-body">Body Paragraph text</div>
        <div class="behtml-card-footer">
          <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">meta_1</span>
          <a href="#" class="becss-btn-sm">Action Button</a>
        </div>
      </div>

      <div class="behtml-card">
        <div class="behtml-card-header">
          <span class="behtml-card-badge">tag_2</span>
        </div>
        <h2 class="behtml-card-title">Card Title</h2>
        <div class="behtml-card-body">Body Paragraph text</div>
        <div class="behtml-card-footer">
          <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">meta_2</span>
          <a href="#" class="becss-btn-sm">Action Button</a>
        </div>
      </div>

      <div class="behtml-card">
        <div class="behtml-card-header">
          <span class="behtml-card-badge">tag_3</span>
        </div>
        <h2 class="behtml-card-title">Card Title</h2>
        <div class="behtml-card-body">Body Paragraph text</div>
        <div class="behtml-card-footer">
          <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">meta_3</span>
          <a href="#" class="becss-btn-sm">Action Button</a>
        </div>
      </div>
    </main>

    <footer class="becss-footer">
      <div>footer_text</div>
      <div class="becss-footer-links">
        <a href="#" class="becss-footer-link">footer_link_1</a>
        <a href="#" class="becss-footer-link">footer_link_2</a>
      </div>
    </footer>
  </div>
</body>
</html>
