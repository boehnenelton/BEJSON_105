<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Title</title>
<!--
Name:           BEHTML Image Lightbox Scaffold
Description:    Interactive image gallery with zero-filler modal lightbox overlay (Layer 1, z=32), previous/next navigation, and image caption slots.
Author:         Elton Boehnen
Release_Version: 300
Package_Version: 105
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-canvas: #060606;
    --bg-surface: #101010;
    --bg-surface-elevated: #161616;
    --bg-image: #141414;
    --fg-primary: #FFFFFF;
    --fg-secondary: #CCCCCC;
    --fg-muted: #888888;
    --border-color: #262626;
    --border-light: #3a3a3a;
    --accent-red: #DE2626;
    --radius-main: 6px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-canvas);
    color: var(--fg-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 24px 20px 60px;
  }

  code, pre, .becss-mono {
    font-family: 'Source Code Pro', monospace;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .becss-navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 24px;
  }

  .becss-brand {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg-primary);
    text-decoration: none;
  }

  .becss-badge {
    border: 1px solid var(--accent-red);
    color: var(--accent-red);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 2px;
    font-family: 'Source Code Pro', monospace;
  }

  .becss-header {
    background: var(--bg-surface);
    border-radius: var(--radius-main);
    border-top: 3px solid var(--accent-red);
    padding: 28px 24px;
    margin-bottom: 24px;
  }

  .becss-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .becss-sub {
    font-size: 0.95rem;
    color: var(--fg-secondary);
  }

  /* Gallery Grid */
  .becss-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .becss-gallery-thumb {
    aspect-ratio: 1 / 1;
    background-color: var(--bg-image);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-main);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .becss-gallery-thumb:hover {
    border-color: var(--accent-red);
  }

  /* Lightbox Overlay (Layer 1, z=32) */
  .becss-lightbox-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 32;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .becss-lightbox-backdrop.is-open {
    display: flex;
  }

  .becss-lightbox-modal {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .becss-lightbox-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--fg-secondary);
    font-size: 13px;
  }

  .becss-lightbox-close {
    background: transparent;
    border: none;
    color: #FFFFFF;
    font-size: 20px;
    cursor: pointer;
  }

  .becss-lightbox-stage {
    width: 100%;
    aspect-ratio: 16 / 10;
    background-color: #000000;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .becss-lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--border-color);
    color: #FFFFFF;
    padding: 8px 12px;
    cursor: pointer;
    font-family: inherit;
    border-radius: 4px;
  }

  .becss-lightbox-nav.prev { left: 16px; }
  .becss-lightbox-nav.next { right: 16px; }

  .becss-lightbox-caption {
    font-size: 13px;
    color: var(--fg-secondary);
    text-align: center;
  }

  .becss-btn-sm {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--fg-secondary);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }

  .becss-btn-sm:hover {
    border-color: var(--accent-red);
    color: var(--accent-red);
  }
</style>
</head>
<body>
  <div class="container">
    <header class="becss-navbar">
      <a href="#" class="becss-brand">
        <span class="becss-badge">LIGHTBOX</span>
        <span>App Brand</span>
      </a>
      <a href="#" class="becss-btn-sm">nav_link_1</a>
    </header>

    <section class="becss-header">
      <h1 class="becss-title">Section Heading</h1>
      <p class="becss-sub">Subtitle</p>
    </section>

    <main class="becss-gallery-grid">
      <div class="becss-gallery-thumb" onclick="openLightbox('item_1')">
        <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">Image 1</span>
      </div>
      <div class="becss-gallery-thumb" onclick="openLightbox('item_2')">
        <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">Image 2</span>
      </div>
      <div class="becss-gallery-thumb" onclick="openLightbox('item_3')">
        <span class="becss-mono" style="font-size: 11px; color: var(--fg-muted);">Image 3</span>
      </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="becss-lightbox-backdrop" id="lightboxModal" onclick="closeLightbox(event)">
      <div class="becss-lightbox-modal">
        <div class="becss-lightbox-header">
          <span class="becss-mono" id="lightboxCounter">1 of 3</span>
          <button type="button" class="becss-lightbox-close" onclick="closeLightbox(event)">&times;</button>
        </div>
        <div class="becss-lightbox-stage">
          <button type="button" class="becss-lightbox-nav prev">&larr;</button>
          <span class="becss-mono" style="font-size: 13px; color: var(--fg-muted);">Full Image View</span>
          <button type="button" class="becss-lightbox-nav next">&rarr;</button>
        </div>
        <div class="becss-lightbox-caption">Card Title</div>
      </div>
    </div>
  </div>

  <script>
    function openLightbox(id) {
      const modal = document.getElementById('lightboxModal');
      if (modal) modal.classList.add('is-open');
    }
    function closeLightbox(e) {
      if (e.target.id === 'lightboxModal' || e.target.classList.contains('becss-lightbox-close')) {
        const modal = document.getElementById('lightboxModal');
        if (modal) modal.classList.remove('is-open');
      }
    }
  </script>
</body>
</html>
