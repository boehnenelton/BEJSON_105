<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Title</title>
<!--
Name:           BEHTML Taxonomy Feed Scaffold
Description:    Clean taxonomy feed scaffold with breadcrumbs, filter bar, stacked/grid feed cards, and dedicated pagination controls.
Author:         Elton Boehnen
Release_Version: 300
Package_Version: 105
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-canvas: #060606;
    --bg-surface: #101010;
    --bg-surface-elevated: #161616;
    --fg-primary: #FFFFFF;
    --fg-secondary: #CCCCCC;
    --fg-muted: #888888;
    --border-color: #262626;
    --border-light: #3a3a3a;
    --accent-red: #DE2626;
    --radius-main: 6px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-canvas);
    color: var(--fg-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 24px 20px 60px;
  }

  code, pre, .becss-mono {
    font-family: 'Source Code Pro', monospace;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  /* Breadcrumb Navigation */
  .becss-breadcrumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 20px;
  }

  .becss-breadcrumb-link {
    color: var(--fg-muted);
    text-decoration: none;
  }

  .becss-breadcrumb-link:hover {
    color: var(--fg-primary);
  }

  .becss-breadcrumb-separator {
    color: var(--border-light);
  }

  .becss-breadcrumb-current {
    color: var(--accent-red);
    font-weight: 600;
  }

  /* Header Section */
  .becss-feed-header {
    background: var(--bg-surface);
    border-radius: var(--radius-main);
    border-top: 3px solid var(--accent-red);
    padding: 28px 24px;
    margin-bottom: 24px;
  }

  .becss-feed-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .becss-feed-sub {
    font-size: 0.95rem;
    color: var(--fg-secondary);
  }

  /* Filter Bar */
  .becss-filter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .becss-filter-group {
    display: flex;
    gap: 8px;
  }

  .becss-filter-pill {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    color: var(--fg-secondary);
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }

  .becss-filter-pill.is-active {
    background: var(--accent-red);
    border-color: var(--accent-red);
    color: #FFFFFF;
    font-weight: 600;
  }

  /* Feed Item List */
  .becss-feed-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }

  .becss-feed-item {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-main);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s ease;
  }

  .becss-feed-item:hover {
    border-color: var(--border-light);
  }

  .becss-feed-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--fg-muted);
  }

  .becss-feed-item-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--fg-primary);
  }

  .becss-feed-item-body {
    font-size: 13px;
    color: var(--fg-secondary);
  }

  .becss-feed-actions {
    display: flex;
    justify-content: flex-end;
    padding-top: 8px;
  }

  .becss-btn-sm {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--fg-secondary);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }

  .becss-btn-sm:hover {
    border-color: var(--accent-red);
    color: var(--accent-red);
  }

  /* Paging Feet */
  .becss-paging-feet {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-main);
    padding: 12px 20px;
    font-size: 13px;
    color: var(--fg-secondary);
  }
</style>
</head>
<body>
  <div class="container">
    <nav class="becss-breadcrumbs" aria-label="Breadcrumb">
      <a href="#" class="becss-breadcrumb-link">topnav</a>
      <span class="becss-breadcrumb-separator">/</span>
      <a href="#" class="becss-breadcrumb-link">Category</a>
      <span class="becss-breadcrumb-separator">/</span>
      <span class="becss-breadcrumb-current">Feed</span>
    </nav>

    <header class="becss-feed-header">
      <h1 class="becss-feed-title">Section Heading</h1>
      <p class="becss-feed-sub">Subtitle</p>
    </header>

    <div class="becss-filter-bar">
      <div class="becss-filter-group">
        <button type="button" class="becss-filter-pill is-active">Filter 1</button>
        <button type="button" class="becss-filter-pill">Filter 2</button>
      </div>
      <div>
        <button type="button" class="becss-btn-sm">Sort By</button>
      </div>
    </div>

    <main class="becss-feed-list">
      <article class="becss-feed-item">
        <div class="becss-feed-meta-row">
          <span class="becss-mono">meta_tag</span>
          <span>Timestamp</span>
        </div>
        <h2 class="becss-feed-item-title">Card Title</h2>
        <div class="becss-feed-item-body">Body Paragraph text</div>
        <div class="becss-feed-actions">
          <a href="#" class="becss-btn-sm">Action Button</a>
        </div>
      </article>

      <article class="becss-feed-item">
        <div class="becss-feed-meta-row">
          <span class="becss-mono">meta_tag</span>
          <span>Timestamp</span>
        </div>
        <h2 class="becss-feed-item-title">Card Title</h2>
        <div class="becss-feed-item-body">Body Paragraph text</div>
        <div class="becss-feed-actions">
          <a href="#" class="becss-btn-sm">Action Button</a>
        </div>
      </article>
    </main>

    <nav class="becss-paging-feet" aria-label="Pagination">
      <a href="#" class="becss-btn-sm">Prev</a>
      <span class="becss-mono">Page 1 of 10</span>
      <a href="#" class="becss-btn-sm">Next</a>
    </nav>
  </div>
</body>
</html>
